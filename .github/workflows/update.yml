name: Update market data

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC; Redfin refreshes monthly, so most runs find nothing new
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Redfin data
        run: node scripts/fetch_data.mjs

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data/market.json; then
            echo "No new market data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market.json
            git commit -m "Update market data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
