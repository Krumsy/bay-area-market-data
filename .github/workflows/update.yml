name: Update market data

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC; Redfin refreshes monthly, so most runs find nothing new
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Redfin sales data
        run: node scripts/fetch_data.mjs

      - name: Fetch Realtor.com listing data
        run: node scripts/fetch_listings.mjs

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data/; then
            echo "No new market data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update market data"
            git push
          fi

      # GitHub turns off scheduled workflows on public repos after 60 days without a
      # commit. If neither data source has changed in 50 days, record an empty commit.
      - name: Keep the schedule active
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled data updates active"
            git push
          else
            echo "Last commit is recent; nothing to do."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
